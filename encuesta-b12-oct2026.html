<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Oral B1.2 – Tweetalig</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #2D3E50; }
  header {
    background: #2D3E50;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header img { height: 140px; }
  header div { color: #fff; }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header p { font-size: 0.9rem; color: #1DB8A8; margin-top: 2px; }
  .container { max-width: 700px; margin: 32px auto; padding: 0 16px; }
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .card h2 { color: #2D3E50; font-size: 1.1rem; margin-bottom: 16px; border-bottom: 2px solid #1DB8A8; padding-bottom: 8px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: #2D3E50; margin-bottom: 4px; margin-top: 14px; }
  input[type=text], input[type=email], input[type=number] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #d0d7de;
    border-radius: 6px;
    font-size: 0.95rem;
    transition: border-color 0.2s;
  }
  input:focus { outline: none; border-color: #1DB8A8; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab-btn {
    background: #e8edf2;
    border: none;
    border-radius: 6px 6px 0 0;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #2D3E50;
    cursor: pointer;
    transition: background 0.2s;
  }
  .tab-btn.active { background: #2D3E50; color: #fff; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .franja-grid { display: grid; gap: 10px; }
  .franja-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border: 2px solid #d0d7de;
    border-radius: 8px;
    cursor: pointer;
    background: #fff;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
    font-size: 0.95rem;
    font-weight: 500;
    color: #2D3E50;
  }
  .franja-btn:hover:not(.lleno) { border-color: #1DB8A8; background: #f0faf9; }
  .franja-btn.selected { border-color: #1DB8A8; background: #e0f7f5; }
  .franja-btn.lleno { opacity: 0.5; cursor: not-allowed; background: #f5f5f5; border-color: #ccc; }
  .badge {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    background: #e0f7f5;
    color: #1DB8A8;
    white-space: nowrap;
  }
  .badge.medio { background: #fff4e0; color: #e08c00; }
  .badge.lleno-badge { background: #fde8e8; color: #c0392b; }

  .btn-submit {
    display: block;
    width: 100%;
    padding: 13px;
    background: #1DB8A8;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 20px;
    transition: background 0.2s;
  }
  .btn-submit:hover { background: #17a094; }
  .btn-submit:disabled { background: #aaa; cursor: not-allowed; }

  #paginaConfirmacion { display: none; }
  .confirm-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 36px;
    text-align: center;
    max-width: 600px;
    margin: 40px auto;
  }
  .check-icon { font-size: 3rem; color: #1DB8A8; margin-bottom: 12px; }
  .confirm-card h2 { color: #2D3E50; font-size: 1.4rem; margin-bottom: 8px; }
  .confirm-card p { color: #555; margin-bottom: 8px; line-height: 1.5; }
  .confirm-detail { background: #f0faf9; border-radius: 8px; padding: 16px; margin: 20px 0; text-align: left; }
  .confirm-detail p { margin: 4px 0; font-size: 0.95rem; color: #2D3E50; }
  .confirm-detail strong { color: #1DB8A8; }
  .error-msg { color: #c0392b; font-size: 0.85rem; margin-top: 8px; display: none; }
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, runTransaction, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDemoKeyReemplazarConTuClave",
  authDomain: "encuesta-horarios.firebaseapp.com",
  databaseURL: "https://encuesta-horarios-default-rtdb.firebaseio.com",
  projectId: "encuesta-horarios",
  storageBucket: "encuesta-horarios.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const RUTA = 'horarios-b12-oct2026';
const MAX = 3;

const DIAS = [
  { id:'d13', label:'Mar 13 oct', franjas:['5:00 – 7:00 pm'] },
  { id:'d14', label:'Mié 14 oct', franjas:['3:00 – 5:00 pm'] },
  { id:'d15', label:'Jue 15 oct', franjas:['2:00 – 4:00 pm','4:00 – 6:00 pm'] },
  { id:'d16', label:'Vie 16 oct', franjas:['2:00 – 4:00 pm','4:00 – 6:00 pm'] },
  { id:'d19', label:'Lun 19 oct', franjas:['10:00 am – 12:00 pm','12:00 – 2:00 pm'] },
];

let seleccionado = null; // {dia, franjaIdx, label}
let conteos = {};

function slotKey(diaId, fi) { return `${diaId}_f${fi}`; }

function badgeInfo(count) {
  const libre = MAX - count;
  if (libre <= 0) return { text:'Lleno', cls:'lleno-badge' };
  if (libre === 1) return { text:'1 lugar', cls:'medio' };
  return { text:`${libre} lugares`, cls:'' };
}

function renderTabs() {
  const btns = document.getElementById('tabsBtns');
  const content = document.getElementById('tabsContent');
  btns.innerHTML = '';
  content.innerHTML = '';

  DIAS.forEach((dia, di) => {
    // Tab button
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (di === 0 ? ' active' : '');
    btn.textContent = dia.label;
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tc_' + dia.id).classList.add('active');
    };
    btns.appendChild(btn);

    // Tab content
    const tc = document.createElement('div');
    tc.className = 'tab-content' + (di === 0 ? ' active' : '');
    tc.id = 'tc_' + dia.id;
    const grid = document.createElement('div');
    grid.className = 'franja-grid';
    grid.id = 'grid_' + dia.id;
    tc.appendChild(grid);
    content.appendChild(tc);
  });
}

function renderFranjas() {
  DIAS.forEach(dia => {
    const grid = document.getElementById('grid_' + dia.id);
    if (!grid) return;
    grid.innerHTML = '';
    dia.franjas.forEach((franja, fi) => {
      const key = slotKey(dia.id, fi);
      const count = conteos[key] || 0;
      const { text, cls } = badgeInfo(count);
      const lleno = count >= MAX;

      const isSelected = seleccionado && seleccionado.dia === dia.id && seleccionado.franjaIdx === fi;

      const fbtn = document.createElement('button');
      fbtn.className = 'franja-btn' + (lleno ? ' lleno' : '') + (isSelected ? ' selected' : '');
      fbtn.disabled = lleno;
      fbtn.innerHTML = `<span>${franja}</span><span class="badge ${cls}">${text}</span>`;
      fbtn.onclick = () => {
        seleccionado = { dia: dia.id, franjaIdx: fi, label: `${dia.label} · ${franja}` };
        renderFranjas();
      };
      grid.appendChild(fbtn);
    });
  });
}

// Escucha cambios en Firebase
onValue(ref(db, RUTA + '/slots'), snap => {
  conteos = {};
  const data = snap.val() || {};
  Object.entries(data).forEach(([key, arr]) => {
    conteos[key] = Array.isArray(arr) ? arr.length : 0;
  });
  renderFranjas();
});

window.enviarFormulario = async function() {
  const nombre = document.getElementById('nombre').value.trim();
  const apellido = document.getElementById('apellido').value.trim();
  const idNum = document.getElementById('idNum').value.trim();
  const correo = document.getElementById('correo').value.trim();
  const errMsg = document.getElementById('errorMsg');

  if (!nombre || !apellido || !idNum || !correo || !seleccionado) {
    errMsg.style.display = 'block';
    return;
  }
  errMsg.style.display = 'none';

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Registrando...';

  const key = slotKey(seleccionado.dia, seleccionado.franjaIdx);
  const slotRef = ref(db, `${RUTA}/slots/${key}`);

  try {
    const result = await runTransaction(slotRef, current => {
      const arr = current || [];
      if (arr.length >= MAX) return; // abort
      return [...arr, { nombre, apellido, id: idNum, correo, ts: Date.now() }];
    });

    if (result.committed) {
      // Mostrar confirmación
      document.getElementById('paginaFormulario').style.display = 'none';
      document.getElementById('paginaConfirmacion').style.display = 'block';
      document.getElementById('confirmDetalle').innerHTML = `
        <p><strong>Nombre:</strong> ${nombre} ${apellido}</p>
        <p><strong>ID:</strong> ${idNum}</p>
        <p><strong>Correo:</strong> ${correo}</p>
        <p><strong>Nivel:</strong> B1.2</p>
        <p><strong>Fecha y hora:</strong> ${seleccionado.label}</p>
      `;
    } else {
      alert('Este horario ya se llenó mientras registrabas. Por favor escoge otro.');
      btn.disabled = false;
      btn.textContent = 'Confirmar registro';
    }
  } catch(e) {
    alert('Error al guardar. Intenta de nuevo.');
    btn.disabled = false;
    btn.textContent = 'Confirmar registro';
  }
};

renderTabs();
</script>
