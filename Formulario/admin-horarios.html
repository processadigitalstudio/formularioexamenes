<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Admin – Tweetalig</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#f4f7f9;--surface:#fff;--border:#dde4ea;--text:#1c2b3a;--muted:#5a7080;--accent:#1db8a8;--accent-light:#e6f9f7;--accent-dark:#0d8a7d;--navy:#2d3e50;--danger:#b91c1c;--danger-light:#fee2e2;--radius:10px; }
  body { font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem; }
  .container { max-width:900px;margin:0 auto; }
  .logo-wrap { text-align:center;margin-bottom:1.5rem;padding:1rem 2rem;background:#fff;border:1px solid var(--border);border-radius:var(--radius); }
  .logo-wrap img { height:80px;width:auto; }
  #login-page { max-width:360px;margin:0 auto; }
  .login-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem; }
  .login-title { font-size:18px;font-weight:600;color:var(--navy);margin-bottom:4px; }
  .login-sub { font-size:13px;color:var(--muted);margin-bottom:1.5rem; }
  label { display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px; }
  input[type=password] { width:100%;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:15px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;margin-bottom:1rem; }
  input[type=password]:focus { border-color:var(--accent); }
  .btn { width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer; }
  .btn:hover { opacity:0.88; }
  .btn-sm { padding:6px 12px;font-size:12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer; }
  .btn-sm:hover { background:var(--accent-dark); }
  .btn-del { padding:4px 10px;font-size:11px;background:var(--danger-light);color:var(--danger);border:1px solid #fca5a5;border-radius:6px;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap; }
  .btn-del:hover { background:#fca5a5; }
  .err { color:var(--danger);font-size:13px;margin-top:-8px;margin-bottom:12px; }
  #admin-page { display:none; }
  .admin-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px; }
  .admin-title { font-size:20px;font-weight:600;color:var(--navy); }
  .stats-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem; }
  .stat { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;text-align:center; }
  .stat-num { font-size:28px;font-weight:600;color:var(--accent-dark); }
  .stat-label { font-size:12px;color:var(--muted);margin-top:2px; }
  .day-section { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;overflow:hidden; }
  .day-header { background:var(--navy);color:#fff;padding:10px 16px;font-size:14px;font-weight:600; }
  .franja-block { padding:12px 16px;border-bottom:1px solid var(--border); }
  .franja-block:last-child { border-bottom:none; }
  .franja-title { display:flex;justify-content:space-between;align-items:center;margin-bottom:8px; }
  .franja-name { font-size:13px;font-weight:600;color:var(--navy); }
  .franja-count { font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px; }
  .count-ok { background:var(--accent-light);color:var(--accent-dark); }
  .count-full { background:var(--danger-light);color:var(--danger); }
  .count-empty { background:#f1f5f9;color:var(--muted); }
  table { width:100%;border-collapse:collapse;font-size:13px; }
  th { text-align:left;padding:6px 8px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.05em; }
  td { padding:8px 8px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  .empty-slot { font-size:13px;color:var(--muted);font-style:italic;padding:6px 0; }
  .export-btn { background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer; }
  .export-btn:hover { background:var(--accent-dark); }
  footer { text-align:center;font-size:12px;color:var(--muted);margin-top:2rem;padding-bottom:1rem; }
  .confirm-del { background:var(--danger-light);border:1px solid #fca5a5;border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--danger);margin-top:8px; }
</style>
</head>

  <div id="login-page">
    <div class="login-card">
      <p class="login-title">Panel de administración</p>
      <p class="login-sub">Solo para uso interno de Tweetalig.</p>
      <label for="inp-pass">Contraseña</label>
      <input type="password" id="inp-pass" placeholder="••••••••" />
      <p class="err" id="login-err" style="display:none">Contraseña incorrecta.</p>
      <button class="btn" id="btn-login">Ingresar</button>
    </div>
  </div>

  <div id="admin-page">
    <div class="admin-header">
      <p class="admin-title">Registros · Junio 2026</p>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="export-btn" id="btn-export">Exportar CSV</button>
        <button class="btn-sm" id="btn-logout">Cerrar sesión</button>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Registros totales</div></div>
      <div class="stat"><div class="stat-num" id="stat-franjas">0</div><div class="stat-label">Franjas ocupadas</div></div>
      <div class="stat"><div class="stat-num" id="stat-llenas">0</div><div class="stat-label">Franjas llenas</div></div>
    </div>
    <div id="admin-content"></div>
    <footer>Tweetalig · Panel de administración</footer>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const app = initializeApp({ databaseURL: "https://encuesta-horarios-default-rtdb.firebaseio.com/" });
  const db = getDatabase(app);

  const PASS = "tweetalig2026";
  const MAX = 2;
  const DIAS = [
    { id:'d2', label:'Martes 2 de junio', max:2, franjas:['2:00 – 4:00 pm','4:00 – 6:00 pm','6:00 – 8:00 pm'] },
    { id:'d3', label:'Miércoles 3 de junio', max:2, franjas:['7:00 – 9:00 am','9:00 – 11:00 am','11:00 am – 1:00 pm','2:00 – 4:00 pm','4:00 – 6:00 pm','6:00 – 8:00 pm'] },
    { id:'d4', label:'Jueves 4 de junio', max:2, franjas:['7:00 – 9:00 am','9:00 – 11:00 am','11:00 am – 1:00 pm','2:00 – 4:00 pm','4:00 – 6:00 pm','6:00 – 8:00 pm'] },
    { id:'d5', label:'Viernes 5 de junio', max:2, franjas:['7:00 – 9:00 am','9:00 – 11:00 am','11:00 am – 1:00 pm','2:00 – 4:00 pm','4:00 – 6:00 pm','6:00 – 8:00 pm'] },
    { id:'d6', label:'Sábado 6 de junio', max:2, franjas:['8:00 – 10:00 am','10:00 am – 12:00 pm'] },
    { id:'d9', label:'Martes 9 de junio', max:3, franjas:['7:00 – 9:00 am','9:00 – 11:00 am','11:00 am – 1:00 pm','2:00 – 4:00 pm','4:00 – 6:00 pm','6:00 – 8:00 pm'] },
  ];

  let liveData = {};
  function slotKey(d, i) { return d + '_f' + i; }
  function getEntries(k) { const v = liveData[k]; if (!v) return []; return Array.isArray(v)?v:Object.values(v); }

  document.getElementById('btn-login').onclick = () => {
    if (document.getElementById('inp-pass').value === PASS) {
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('admin-page').style.display = 'block';
      startListening();
    } else { document.getElementById('login-err').style.display = 'block'; }
  };
  document.getElementById('inp-pass').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btn-login').click(); });
  document.getElementById('btn-logout').onclick = () => location.reload();

  function startListening() {
    onValue(ref(db, 'horarios'), snap => { liveData = snap.val() || {}; renderAdmin(); });
  }

  async function deleteStudent(slotKeyStr, studentIndex) {
    const slotRef = ref(db, 'horarios/' + slotKeyStr);
    const snap = await get(slotRef);
    let arr = snap.val();
    if (!arr) return;
    arr = Array.isArray(arr) ? arr : Object.values(arr);
    arr.splice(studentIndex, 1);
    await set(slotRef, arr.length > 0 ? arr : null);
  }

  function renderAdmin() {
    let total = 0, franjasOcupadas = 0, franjasLlenas = 0;
    const content = document.getElementById('admin-content');
    content.innerHTML = '';
    DIAS.forEach(d => {
      const section = document.createElement('div');
      section.className = 'day-section';
      section.innerHTML = `<div class="day-header">${d.label}</div>`;
      d.franjas.forEach((f, i) => {
        const key = slotKey(d.id, i);
        const entries = getEntries(key);
        const count = entries.length;
        if (count > 0) { franjasOcupadas++; total += count; }
        if (count >= (d.max||2)) franjasLlenas++;
        const MAX=d.max||2; const countClass = count===0?'count-empty':count>=MAX?'count-full':'count-ok';
        const countText = count===0?'Vacío':count>=MAX?'Lleno':`${count}/${MAX}`;
        const block = document.createElement('div');
        block.className = 'franja-block';

        let tableHTML = '';
        if (entries.length) {
          tableHTML = `<table><thead><tr><th>Nombre</th><th>Apellido</th><th>ID</th><th>Nivel</th><th>Correo</th><th>Acción</th></tr></thead><tbody>`;
          entries.forEach((e, ei) => {
            tableHTML += `<tr>
              <td>${e.nombre||''}</td><td>${e.apellido||''}</td><td>${e.id||''}</td>
              <td>${e.nivel||''}</td><td>${e.email||''}</td>
              <td><button class="btn-del" data-key="${key}" data-idx="${ei}">Eliminar</button></td>
            </tr>`;
          });
          tableHTML += `</tbody></table>`;
        } else {
          tableHTML = `<p class="empty-slot">Sin registros</p>`;
        }

        block.innerHTML = `<div class="franja-title"><span class="franja-name">${f}</span><span class="franja-count ${countClass}">${countText}</span></div>${tableHTML}`;
        section.appendChild(block);
      });
      content.appendChild(section);
    });

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-franjas').textContent = franjasOcupadas;
    document.getElementById('stat-llenas').textContent = franjasLlenas;

    // Botones eliminar
    document.querySelectorAll('.btn-del').forEach(btn => {
      btn.onclick = async () => {
        const key = btn.dataset.key;
        const idx = parseInt(btn.dataset.idx);
        const row = btn.closest('tr');
        const nombre = row.cells[0].textContent + ' ' + row.cells[1].textContent;
        if (confirm(`¿Eliminar el registro de ${nombre}? Esta acción libera su franja.`)) {
          await deleteStudent(key, idx);
        }
      };
    });
  }

  document.getElementById('btn-export').onclick = () => {
    let csv = 'Fecha,Franja,Nombre,Apellido,ID,Nivel,Correo\n';
    DIAS.forEach(d => {
      d.franjas.forEach((f, i) => {
        getEntries(slotKey(d.id, i)).forEach(e => {
          csv += `"${d.label}","${f}","${e.nombre||''}","${e.apellido||''}","${e.id||''}","${e.nivel||''}","${e.email||''}"\n`;
        });
      });
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
    a.download = 'registros-tweetalig.csv'; a.click();
  };
</script>
